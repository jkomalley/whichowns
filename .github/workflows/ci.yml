name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Format check
        run: uv run --locked ruff format --check src/ tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: uv run --locked ruff check --no-fix src/ tests/

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Type check
        run: uv run --locked ty check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: uv run --locked pytest --cov --cov-fail-under=100

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      # The brew integration test checks a known formula, so every run tests the
      # same command.
      - name: Set up Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1" # Skips a slow self-update before installing.
        run: |
          # The Ubuntu image includes Homebrew but leaves it off PATH.
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          brew install hello

      # Same command as `just integration`; see the justfile for the flags.
      - name: Integration tests
        run: uv run --locked --isolated --no-editable --reinstall-package whichowns pytest -m integration tests/integration

  ci-success:
    if: always() # GitHub treats a skipped required check as passing.
    needs: [format, lint, type, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.result == "success")' <<< "$NEEDS"
