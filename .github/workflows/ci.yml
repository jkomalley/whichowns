name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Format check
        run: uv run --locked ruff format --check src/ tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: uv run --locked ruff check --no-fix src/ tests/

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Type check
        run: uv run --locked ty check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: uv run --locked pytest --cov --cov-fail-under=100

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build wheel
        run: uv build --wheel

      # Install the dev tools without the project, then the wheel in its place,
      # so the tests exercise what users install rather than the source tree.
      - name: Install wheel
        run: |
          uv sync --locked --no-install-project
          uv pip install dist/*.whl

      # --no-sync stops uv run from reinstalling the editable project.
      - name: Integration tests
        run: uv run --no-sync pytest -m integration --no-cov
