[project]
name = "whichowns"
version = "0.1.0"
description = "Find which package manager owns a command."
readme = "README.md"
authors = [
    { name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/jkomalley/whichowns"
Repository = "https://github.com/jkomalley/whichowns"
Issues = "https://github.com/jkomalley/whichowns/issues"

[project.scripts]
whichowns = "whichowns.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "COM812", # missing trailing comma (conflicts with formatter)
    "ISC001", # single-line implicit string concatenation (conflicts with formatter)
    "FIX002", # line contains TODO
    "TD002",  # missing author in TODO
    "TD003",  # missing issue link in TODO
    "TRY003", # avoid specifying long messages outside the exception class
    "CPY001", # missing copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # use of assert (pytest relies on it)
]

# ty skips code it considers unreachable on the host platform, so checking on
# Linux alone would silently skip macOS-only branches.
[tool.ty.environment]
python-platform = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
markers = [
    "integration: end-to-end tests with real package managers; deselected by default",
]
addopts = [
    "-ra",
    "-m", "not integration",
]

[tool.coverage.run]
source = ["whichowns"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.",
]
