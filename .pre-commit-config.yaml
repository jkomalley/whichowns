default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Hooks call just recipes so commands and paths live only in the justfile.
repos:
  - repo: local
    hooks:
      - id: lint
        name: just lint
        entry: just lint
        language: system
        pass_filenames: false

      - id: fmt
        name: just fmt
        entry: just fmt
        language: system
        pass_filenames: false

      # Repeat the commit-stage checks without fixing, for commits that
      # skipped the hooks.
      - id: lint-check
        name: just lint --no-fix
        entry: just lint --no-fix
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: fmt-check
        name: just fmt --check
        entry: just fmt --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: type
        name: just type
        entry: just type
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cov
        name: just cov
        entry: just cov
        language: system
        pass_filenames: false
        stages: [pre-push]
