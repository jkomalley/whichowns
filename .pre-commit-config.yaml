default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Hooks call just recipes so commands, paths and flags live only in the justfile.
repos:
  - repo: local
    hooks:
      - id: lint
        name: just lint
        entry: just lint
        language: system
        types: [python]
        pass_filenames: false

      - id: fmt
        name: just fmt
        entry: just fmt
        language: system
        types: [python]
        pass_filenames: false

      - id: type
        name: just type
        entry: just type
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: just test
        entry: just test --cov-fail-under=100
        language: system
        pass_filenames: false
        stages: [pre-push]
