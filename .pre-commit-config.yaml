default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Hooks call just recipes so commands and paths live only in the justfile.
repos:
  - repo: local
    hooks:
      # Also run on push, for commits that skipped the commit hooks.
      - id: lint
        name: just lint --no-fix
        entry: just lint --no-fix
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: fmt
        name: just fmt --check
        entry: just fmt --check
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: type
        name: just type
        entry: just type
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cov
        name: just cov
        entry: just cov
        language: system
        pass_filenames: false
        stages: [pre-push]
